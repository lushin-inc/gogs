:root{
 --bg:#f3f1ec; --text:#24211e; --muted:#6b645c; --line:#dcd6cc; --field:#fbfaf7;
 --accent:#a8492a; --accq:rgba(168,73,42,.11); --card:#ffffff; --on:#fff4ee;
 --bar:#2a2522; --bart:#f6efe9; --barm:#c9bdb2; --ont:#fff;
}
:root[data-theme="dark"]{
 --bg:#161412; --text:#efe9e3; --muted:#a99f95; --line:#332e2a; --field:#1f1c19;
 --accent:#e8946c; --accq:rgba(232,148,108,.14); --card:#1d1a17; --on:#2a201b;
 --bar:#0f0d0c; --bart:#f3ece6; --barm:#a99f95; --ont:#1a120e;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#161412; --text:#efe9e3; --muted:#a99f95; --line:#332e2a; --field:#1f1c19;
  --accent:#e8946c; --accq:rgba(232,148,108,.14); --card:#1d1a17; --on:#2a201b;
  --bar:#0f0d0c; --bart:#f3ece6; --barm:#a99f95; --ont:#1a120e;
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 font-size:16px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased;
 padding-bottom:150px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:736px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
 backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
 border-bottom:1px solid var(--line);padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topin{max-width:736px;margin:0 auto;display:flex;align-items:center;gap:11px;min-height:40px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;flex:0 0 auto}
.brand{flex:1;min-width:0;font-size:17px;font-weight:500;letter-spacing:-.3px}
.tt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--field);
 border-radius:10px;padding:0 12px;margin:16px 0 12px;color:var(--muted)}
.search input{min-width:0;width:100%;background:transparent;color:var(--text);border:0;padding:13px 0;font:inherit;font-size:16px;outline:none}
.search input::placeholder{color:var(--muted);opacity:1;font-size:14px}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;text-align:center;padding:8px 6px;border-radius:7px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--ont)}
.chips{display:flex;flex-wrap:nowrap;gap:6px;margin:4px -16px 6px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;font-size:13px;padding:6px 11px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--accq);border-color:var(--accent);color:var(--accent)}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;gap:10px}
.sort{font-size:13px;color:var(--muted);display:flex;gap:14px}
.sort button.on{color:var(--accent);font-weight:500}
.playall{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--accent);font-weight:500}
.ch{font:500 13px/1.4 Inter,sans-serif;color:var(--accent);margin:24px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.list{list-style:none;padding:0;margin:0}
.clip{border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 0}
.pb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accq);color:var(--accent);flex:0 0 auto;margin-top:1px}
.pb svg{width:16px;height:16px;fill:currentColor;stroke:none}
.clip.on .pb{background:var(--accent);color:var(--ont)}
.tx{flex:1;min-width:0}
.ti{display:block;font-size:15.5px;line-height:1.45;font-weight:500}
.clip.done .ti{color:var(--muted);font-weight:400}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12px;color:var(--muted)}
.mt .best{color:var(--accent)}
.st{color:var(--muted);padding:9px 2px 0}
.st.on{color:var(--accent)}
.st.on svg{fill:currentColor}
.more{display:none;padding:0 0 14px 50px}
.clip.open .more{display:block}
.kw{margin:0 0 8px;font-size:14.5px;line-height:1.55}
.note{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.note b{font-weight:500;color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px}
.acts button{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
.player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bar);color:var(--bart);
 padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.player[hidden]{display:none}
.pin{max-width:736px;margin:0 auto}
.pt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{font-size:11.5px;color:var(--barm);display:flex;justify-content:space-between;margin-top:1px}
.prog{height:16px;display:flex;align-items:center;cursor:pointer;margin:4px 0 2px}
.prog div{height:4px;border-radius:2px;background:rgba(255,255,255,.18);width:100%;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctl button{width:44px;height:40px;display:grid;place-items:center;border-radius:10px}
.ctl .big{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--ont)}
.ctl .big svg{width:22px;height:22px;fill:currentColor;stroke:none}
.ctl .sp{font-size:13px;width:52px;color:var(--barm)}
.ctl .kp{font-size:12px;width:auto;padding:0 4px;color:var(--barm);white-space:nowrap}
.ctl .kp.on{color:var(--accent)}
.ctl .kp[hidden]{display:none}
.err{background:#7a2e1a;color:#fff;font-size:13px;padding:8px 12px;border-radius:8px;margin-top:8px}
</style>
</head>

<script type="application/json" id="data">{"clips":[{"id":"c001","s":14.0,"e":52.0,"c":0,"t":"Life is not fair, so prepare for it","k":"Accepting that life will hit everyone lets you prepare, and the right mindset keeps you in the fight.","cat":"truth","r":2,"q":"life isnt fair, mindset, cant hurt me, foreword, prepare, accept","bm":null,"g":"1AyhrBwvZMGYx4hkXXBZWWTNu8iErzweX"},{"id":"c002","s":91.0,"e":133.0,"c":0,"t":"Building a mental toolbox through repetition","k":"As the weakest of the litter with no mental toughness training, he built his toolbox through practice and repetition, not theory.","cat":"advice","r":1,"q":"underdog, mental toolbox, repetition, practice, mental toughness, foreword","bm":null,"g":"1i4qryot9OsYMyRpL70uJSeLRx8BffteV"},{"id":"c003","s":133.0,"e":201.0,"c":0,"t":"No one is coming to save you","k":"Peace and fulfillment could only come from facing his life alone and going to war with himself, not from outside rewards.","cat":"truth","r":2,"q":"no one is coming to save you, self-fulfillment, war with yourself, sewer, purpose, foreword","bm":null,"g":"1TqzVQkwowWbENBwX7zWAKCeDCMEie5ze"},{"id":"c004","s":326.0,"e":433.0,"c":0,"t":"Your mind has the tactical advantage","k":"Your mind knows your fears and filters out pain, so the tools teach you to triple down on weaknesses and discomfort to become mentally tough.","cat":"advice","r":3,"q":"tactical advantage, mind, fears, insecurities, tripling down, mentally tough, toolbox, challenges","bm":"tactical advantage","g":"1jjv9kdIQ6uowPFwfrI0y_gEkI8C_if8D"},{"id":"c005","s":413.0,"e":514.0,"c":0,"t":"The mission against a soft life","k":"The situation is a life too comfortable to reach your potential; the mission is to ditch victim thinking, own everything, and stop only when done.","cat":"truth","r":3,"q":"situation, soft life, mission, callous your mind, victim mentality, ownership, stop when done, hero is you","bm":"SITUATION SOFT LIFE","g":"1qKd_1QQAaI9DxRel4N-X3AqtA1bORMXo"},{"id":"c006","s":517.0,"e":552.0,"c":1,"t":"Denial is the ultimate comfort zone","k":"Believing you know your potential is not the same as knowing it, and millions live addicted to comfort and victimhood.","cat":"truth","r":2,"q":"denial, comfort zone, zombies, victim mentality, potential, introduction","bm":null,"g":"1eDRZhUgRMXj44JJDyeRG0ji0HhMRRrLt"},{"id":"c007","s":599.0,"e":626.0,"c":1,"t":"Self-limiting habits and why pep talks fail","k":"Habitual self-limiting choices are hardwired, so motivation and self-help hacks are only temporary fixes that change nobody.","cat":"truth","r":2,"q":"motivation is crap, habits, self-help, pep talk, brain wiring, comfortable choices","bm":null,"g":"1RnuWrMlENRmkqrmSaYkYTi09VH4L5aPb"},{"id":"c008","s":626.0,"e":670.0,"c":1,"t":"Most people live at 40 percent of capability","k":"He fixed his own bad hand by seeking pain, and argues nearly everyone is living at about forty percent of what they can do.","cat":"advice","r":2,"q":"40 percent, 40% rule, potential, seek pain, suffering, hardest man","bm":null,"g":"1lpioDoIlAA6EbQ4DVMRlnyz5-JI_aVci"},{"id":"c009","s":670.0,"e":768.0,"c":1,"t":"Challenging the MIT professor on genetic limits","k":"At an MIT panel he rejected the idea of hard genetic ceilings, saying the one percent willing to do the work can defy the odds.","cat":"truth","r":2,"q":"mit, professor, genetic limits, one percent, armored mind, mental toughness panel","bm":null,"g":"1IjsX-PLfrNyot4gh2-F6GyZ3DYLrGFO7"},{"id":"c010","s":768.0,"e":823.0,"c":1,"t":"Heraclitus and becoming the one warrior","k":"Out of a hundred men only one is a warrior, and only you can equip and master your mind to become that one.","cat":"advice","r":2,"q":"heraclitus, one warrior, battlefield, master your mind, greatness","bm":null,"g":"16hVMoX2N-RDyR5WhcjbZIv_RPOMDT7lw"},{"id":"c011","s":823.0,"e":889.0,"c":1,"t":"Time to go to war with yourself","k":"His story maps a path to self-mastery where any obstacle, from racism to obesity, becomes fuel for change ackers and Myoplex","k":"His entire race plan and fuel came from a Walmart run the night before, and he refused to plan because the bigness would overwhelm him.","cat":"story","r":2,"q":"ritz crackers, myoplex, walmart, john metz, race plan, strategy","bm":null,"g":"17ZRHSrt4Dm5QaEkDHGSzOSQ4O7Jk3oqj"},{"id":"c164","s":23097.0,"e":23198.0,"c":7,"t":"Running across the sky past the marathon","k":"Past 26.2 miles with no training, the remaining distance felt incomprehensible and the question of why started bubbling up.","cat":"pain","r":2,"q":"marathon, running across the sky, why, kate, john metz, purpose","bm":null,"g":"1iVtFhf-iW4CW-ZpiXgrOfPnWdYnV88mw"},{"id":"c165","s":23473.0,"e":23512.0,"c":7,"t":"Conditioning yourself to fear in free fall","k":"His first high-altitude jumps were pure fear, but repeated exposure raised his tolerance until he could function and even enjoy it.","cat":"advice","r":2,"q":"free fall, fear of heights, yuma, conditioning, master what you fear","bm":null,"g":"1BLWfnEGU7Vf0hgpKbL-NvkYmy4M0TAen"},{"id":"c166","s":23512.0,"e":23650.0,"c":7,"t":"Midnight jump and the news of Red Wings","k":"From killing rats in kitchens to a midnight combat jump, then his phone floods with news that Red Wings went bad.","cat":"story","r":2,"q":"yuma, midnight jump, freefall school, red wings, morgan luttrell, cell service","bm":"Not big on texting or talking 😂","g":"1UBuQXM6dKfvH9mp5vh3M5-JHVXot3Sv-"},{"id":"c167","s":23782.0,"e":23926.0,"c":7,"t":"Operation Red Wings and the lone survivor","k":"The firefight, the downed Chinook and Marcus Luttrell surviving as the lone survivor of the worst loss in SEAL history.","cat":"story","r":2,"q":"operation red wings, lone survivor, chinook, marcus luttrell, afghanistan","bm":null,"g":"14a_Ldbn6OmueWvis1XrzwAbXCTdtGlz-"},{"id":"c168","s":23926.0,"e":24030.0,"c":7,"t":"Vowing to run Badwater for fallen families","k":"After Red Wings he commits to run Badwater 135 to raise money for the Special Operations Warrior Foundation.","cat":"story","r":2,"q":"badwater 135, special operations warrior foundation, death valley, fundraising, red wings","bm":null,"g":"1ir6sUV5D-uxLHTNXz7hIU2YdJXo3W1-K"},{"id":"c169","s":24145.0,"e":24324.0,"c":7,"t":"Cosman's challenge to run 100 miles this weekend","k":"The unimpressed race director refuses to waive the standards and sarcastically tells him to go run 100 miles in three days.","cat":"story","r":2,"q":"chris kostman, badwater standards, san diego one day, three days notice, pretender","bm":null,"g":"1LkEXutM06hPrroCIWjqklZiFA6S1Uhy-"},{"id":"c170","s":24324.0,"e":24509.0,"c":7,"t":"Breaking down after mile fifty","k":"His legs, feet, shins and lungs fail one after another and he starts hallucinating the BUD/S log as the why question loops.","cat":"pain","r":2,"q":"mile fifty, stress fractures, shin pain, hallucinating, buds log, why","bm":null,"g":"1DPyIj8XXtvgxJIG6WC6TkE_XDCKOvMrp"},{"id":"c171","s":24509.0,"e":24690.0,"c":7,"t":"Collapse in the lawn chair at mile seventy","k":"At mile 70 he collapses, pisses blood and soils himself, hiding it from Kate before standing on fractured feet.","cat":"story","r":2,"q":"mile seventy, lawn chair, kate, blood, stress fractures, hubris","bm":null,"g":"1GxwZVQnGC7IUIdkHYJwlCPdzsqfIhCod"},{"id":"c172","s":24731.0,"e":24826.0,"c":7,"t":"Realizing the fight had to get personal","k":"When Kate says he will miss the cutoff, he realizes the fight is about how much he is willing to suffer, not the charity.","cat":"pain","r":3,"q":"mile 81, kate, personal, refuse to quit, only you goggins, suffering","bm":null,"g":"1Knwjj23FCLDwRiG4M6O52hi-RmWITmoJ"},{"id":"c173","s":24844.0,"e":24998.0,"c":7,"t":"Still the worst suffering after sixty ultras","k":"Goggins says the San Diego One Day remains his top suffering because he was untrained and used the same muscles for hours.","cat":"pain","r":2,"q":"san diego one day, sixty ultras, hell week, under prepared, number one suffering","bm":null,"g":"111kWmWS48TezWHb5DjpS-VtDtR88Z0ZE"},{"id":"c174","s":24998.0,"e":25067.0,"c":7,"t":"Dreams never include the pain","k":"We dream up big goals from the comfort of the couch, and only on the mountain do we see the pain we never imagined.","cat":"truth","r":2,"q":"dreams, comfort zone, couch, mount everest, glory not pain","bm":"Dreams Come without the pain","g":"1q0TcKVEB9ONWXki9qTpUbRauP3IYqQ2U"},{"id":"c175","s":25072.0,"e":25144.0,"c":7,"t":"Prepare answers before the pain hits","k":"Goals are hatched in comfort, so if you have not prepared answers for the questions suffering raises, your mind will pick quitting.","cat":"advice","r":3,"q":"simple questions, comfort zone, prepare in advance, agonizing pain, quitting mind, why","bm":"!!!! You need to have answers to the questions that come up when you are in agonizing pain, otherwise your answer for why will be something to get you out of it","g":"1Lsr8epFZo1R0_UqIHgALIoEr-dDSuVWa"},{"id":"c176","s":25144.0,"e":25199.0,"c":7,"t":"Hell Week as the fairest place on earth","k":"Hell Week packs decades of wisdom into 130 hours and was a pure war of himself against himself with no trophies.","cat":"pain","r":2,"q":"hell week, 130 hours, me against me, native speaker, no trophies","bm":null,"g":"1FUGWMPCh_MRTV2-6-8yu5m0G5ocjKM2m"},{"id":"c177","s":25199.0,"e":25362.0,"c":7,"t":"Discovering the cookie jar at mile 81","k":"Screaming back at his doubts, he digs into memories of past victories and feels his adrenaline and pace return.","cat":"advice","r":3,"q":"cookie jar, self talk, past victories, asvab, mile 81, hard motherfucker","bm":"Cookie jar – remember all the things you have overcome in the past","g":"1yi9SBpK4HLIm3zmSVQ3SXHze_OmEQZEm"},{"id":"c178","s":25362.0,"e":25458.0,"c":7,"t":"Small victories as kindling","k":"Everyone has a cookie jar, and even small wins like losing the first five pounds are the sparks that build a bonfire.","cat":"advice","r":2,"q":"cookie jar, small wins, five pounds, kindling, small sparks, reading","bm":"If you can lose 5 pounds in a week you can accomplish your goal","g":"14ngmAVdrboTPzUdQgn45QMpZ05AfqY3p"},{"id":"c179","s":25458.0,"e":25532.0,"c":7,"t":"Savor past wins to fuel new ones","k":"Use past successes not to brag but to push through pain, even though the brain resists going there when things go south.","cat":"advice","r":2,"q":"cookie jar, savor victories, accountability mirror, inferno, small fires","bm":null,"g":"1zGdQe3Q4nrqjuP16NsgM_7rIkEoHLMyl"},{"id":"c180","s":25532.0,"e":25593.0,"c":7,"t":"Finishing 101 miles with zero training","k":"Using the cookie jar as an energy bank, each lap became a victory lap until he hit 101 miles in about 19 hours.","cat":"feat","r":2,"q":"101 miles, san diego one day, cookie jar, energy bank, victory lap","bm":null,"g":"1piAfHK0ctMadrwVXOu0JTehO1SJUWvve"},{"id":"c181","s":25593.0,"e":25736.0,"c":7,"t":"Blacking out after the race","k":"After finishing he soils himself, blacks out at home and pees brown bile as a doctor warns of kidney failure.","cat":"story","r":2,"q":"kidney failure, blacked out, kate, bathtub, toenails, er","bm":null,"g":"1hs7WfWBjdZFXo_Ohhx37DImZWkH1NEn8"},{"id":"c182","s":25736.0,"e":25812.0,"c":7,"t":"The pain was his trophy ceremony","k":"He refuses painkillers because the suffering confirmed he had mastered his mind and showed how much more he could do.","cat":"pain","r":3,"q":"trophy ceremony, painkillers, mind, 101 miles, imagine with preparation","bm":null,"g":"1sWi-XJqopR8NQ8MNky7Tm5PPb-nbdKba"},{"id":"c183","s":25812.0,"e":25968.0,"c":7,"t":"Once your mind knows you will not quit","k":"In his worst pain he saw the most beauty, because once the mind accepts it will not quit, it starts finding more.","cat":"advice","r":3,"q":"not quitting, find more, mile 70, control your brain, beauty in pain","bm":"Once your mind knows you're not gonna quit","g":"1k2kjzvnl_fxyqPRvH9tDoYyHHR5bF2W6"},{"id":"c184","s":25968.0,"e":26086.0,"c":7,"t":"Challenge 6: Take inventory of your cookie jar","k":"Write out past victories and obstacles overcome, then draw on them to beat personal bests when pain or doubt hits.","cat":"challenge","r":3,"q":"challenge 6, cookie jar, journal, personal best, inventory","bm":"CHALLENGE 6 - COOKIE JAR","g":"1P5lqyqXFIKr9BHHMtmkNj_TZEPM9nRpa"},{"id":"c185","s":26380.0,"e":26430.0,"c":7,"t":"Your mind is the most powerful tool","k":"You can come from nothing without special trainers or tools, because the mind is the most powerful weapon if you put the phone down.","cat":"truth","r":2,"q":"mind, most powerful weapon, come from nothing, phones, no special tools","bm":null,"g":"1IHWEVX5CAxVSXO8Mnm7aMaTlhjP03Lb0"},{"id":"c186","s":26597.0,"e":26654.0,"c":8,"t":"Someday thinking and procrastination","k":"A man at the gym who will run a 50-miler someday shows how we let our minds demand endless preparation.","cat":"truth","r":2,"q":"procrastination, 50 miler, someday, preparation, excuses","bm":null,"g":"1BAdD1-TuytGKzwEExK_54G9Q7Lh9rTBo"},{"id":"c187","s":26714.0,"e":26767.0,"c":8,"t":"No room to procrastinate when backed into a corner","k":"Procrastination breeds overthinking and self-doubt, but having under three months to lose 106 pounds eliminated it entirely.","cat":"advice","r":2,"q":"procrastination, overthinking, 106 pounds, navy seal recruiter, deadline","bm":"Procrastination was completely eliminated","g":"1qTgH89oZ3Am-Dri2gU_1UAqp0TLtCX0s"},{"id":"c188","s":26805.0,"e":26892.0,"c":8,"t":"Hyper focus beats multitasking","k":"He had to pour everything into the ASVAB because splitting his mind would have made him half-ass at both.","cat":"advice","r":2,"q":"multitasking, hyper focus, asvab, studying, half-ass","bm":null,"g":"1aM4KAxG7az3CfhhJsDA2livgrvwik0lR"},{"id":"c189","s":26892.0,"e":26997.0,"c":8,"t":"Change the way you think","k":"We change everything but how we think, and when he sees a wall now he looks for a door, a window or a crack.","cat":"advice","r":3,"q":"change, fixed mindset, wall, door, open minded, obstacles","bm":"!!!!! **IM ALL ABOUT CHANGE**","g":"1iedP-hK40JwdXRFMcUIn97ONHAHJxapv"},{"id":"c190","s":27031.0,"e":27073.0,"c":8,"t":"I am not crazy just not like you","k":"He is not judging anyone because he has been where they are, and people call him crazy only because he is different.","cat":"truth","r":2,"q":"not crazy, not judging, been there, different","bm":null,"g":"1G-pk7vAj-OP0YdgeiGGklPbtt06R15JB"},{"id":"c191","s":27399.0,"e":27645.0,"c":8,"t":"Qualifying for Boston on broken feet","k":"Unable to run a quarter mile the day before, he charges off at the Las Vegas Marathon and finishes in 3:08 to qualify for Boston.","cat":"feat","r":2,"q":"las vegas marathon, boston qualifier, stress fractures, opportunity, mile eighteen","bm":"IF YOU GIVE ME AN OPPORTUNITY I WILL BREAK THAT MOTHERFUCKER OFF","g":"1q_yonwKDf4BzFpq7J9qWX7kUjxqDOlPf"},{"id":"c192","s":27645.0,"e":27746.0,"c":8,"t":"What am I capable of","k":"At the finish he asks a new open question and realizes we all leave money on the table by habitually settling.","cat":"truth","r":3,"q":"what am i capable of, settling, leaving money on the table, potential","bm":"WHAT AM I CAPABLE OF?","g":"1KeZLwwZLrSUG1S5572QPQm8F76RjPt15"},{"id":"c193","s":27746.0,"e":27788.0,"c":8,"t":"Mindset is what separates us","k":"The one thing that separates people is mindset, and being open to the possibility of conquering anything.","cat":"advice","r":2,"q":"mindset, open minded, separates us, navy seal box","bm":"ONE THING THAT SEPARATES ALL OF US.... MINDSET","g":"16DuitR9K3IF3ai46Wl_t2uhAMJrMLbC2"},{"id":"c194","s":27788.0,"e":27870.0,"c":8,"t":"Too broken to run the day before","k":"Becoming a SEAL was not the pinnacle, and running a fast marathon while broken showed how much he was leaving on the table.","cat":"feat","r":2,"q":"boston, broken, quarter mile, seal pinnacle, leaving it on the table","bm":"I WAS *BROKEN* THE DAY BEFORE TO QUALIFYING FOR BOSTON","g":"1tqdNmEQ7QPpnH22ssG75yYhqeq6QfTU5"},{"id":"c195","s":27870.0,"e":27919.0,"c":8,"t":"True happiness on the other end of suffering","k":"If everyone pushed harder society would be better, and he found true happiness only on the far side of suffering.","cat":"pain","r":3,"q":"true happiness, suffering, what are we capable of, push harder","bm":"!!!!!!!!!!!!!!!!!!!! TRUE HAPPINESS - ON THE OTHER END OF SUFFERING","g":"1N6cqvtUZcNeHiMpIAH4oh47KHDB2yJpG"},{"id":"c196","s":27919.0,"e":27972.0,"c":8,"t":"Stop obeying the voice that says stop","k":"When your mind says stop there is plenty left in the tank, and peace only comes from exploring your limits.","cat":"advice","r":2,"q":"stop, left in the tank, peace, explore yourself, limits","bm":"Stop giving into that feeling in our mind that says stop","g":"10cxAVSbFVWNxC67ca-PdWmAbm37Ljy5m"},{"id":"c197","s":28031.0,"e":28157.0,"c":8,"t":"Hundred mile weeks and the 5am edge","k":"He ran a 16-mile commute and ruck runs before work, and three hours of cardio by dawn made him better at everything.","cat":"advice","r":2,"q":"5am, early morning, mental edge, sixteen mile commute, ruck run, 100 mile weeks","bm":"GET UP AT THE ASS CRACK OF DAWN MENTAL EDGE + BETTER IN ALL FACETS OF LIFE","g":"1ilG1vzW4wLccTNwrMC_6QBwH2ebXJA7B"},{"id":"c198","s":28488.0,"e":28589.0,"c":8,"t":"Enduring a very public screwup","k":"Everyone at the race comments on his rookie mistakes, and a fellow runner reminds him they are all idiots together.","cat":"truth","r":2,"q":"public mistake, humiliation, louis escobar, first trail race, camaraderie","bm":"Have you ever had a very public FUCK UP?","g":"1k8B5XcMSpTh6BJmeKPYCtqrk8qwbC9Gw"},{"id":"c199","s":28751.0,"e":28800.0,"c":8,"t":"How to push when pain is all you feel","k":"At 99 percent empty with two laps left, he asks how to keep going when every cell begs you to quit.","cat":"pain","r":2,"q":"empty tank, impulse to quit, pain threshold, hurt 100","bm":"HOW DO YOU PUSH YOURSELF WHEN PAIN IS ALL YOU FEEL?","g":"1BYDUaOEC7itCA0skR0dB6546IlKYvgx3"},{"id":"c200","s":28800.0,"e":28841.0,"c":8,"t":"Embrace obsession and reject shortcuts","k":"He rejects go-with-the-flow and more-with-less thinking, because growth only comes from pushing past pain and perceived limits.","cat":"truth","r":3,"q":"obsession, shortcuts, go with the flow, push past limits","bm":"OBSESSION - some criticize me for this - get more with less effort - fuck that shit. / FUCK THAT SHORTCUT BULLSHIT - only when I push beyond pain and suffering, when I push past my own limitations. The human body is like a stock car...","g":"1QYUhafkYLaR1nYOQny_mMpDHC6_FyL4z"},{"id":"c201","s":28841.0,"e":28896.0,"c":8,"t":"The governor in your mind","k":"Like a stock car governor, the mind uses pain, fear and insecurity to stop us, but it cannot stop us unless we agree.","cat":"advice","r":2,"q":"governor, stock car, 130 mph, identity, pain, fear","bm":"REMOVE GOVERNOR - ROCKET TO 130 MPH","g":"1_UXSdrWKt6BodX8CW7fUIMmJH-1NNb7E"},{"id":"c202","s":28896.0,"e":28950.0,"c":8,"t":"The 40 percent rule explained","k":"Most people quit at 40 percent of their capacity, and stretching pain tolerance unlocks the other 60 percent.","cat":"advice","r":3,"q":"40 percent rule, governor, 60 percent, pain tolerance, potential","bm":"40% RULE","g":"145KUknciIyBHUusWd_SLhliO3-TekyW9"},{"id":"c203","s":28950.0,"e":29004.0,"c":8,"t":"Approaching an energetic dead end","k":"The urge to quit in work, school or relationships is your mind seeking comfort and status quo, not the truth.","cat":"advice","r":2,"q":"40 percent rule, energetic dead end, comfort, status quo, identity","bm":"I KNOW HOW IT FEELS TO BE APPROACHING AN ENERGETIC DEAD END...","g":"19wN4edzxNO4fpsPzhy8WUbaNTTETr5ln"},{"id":"c204","s":29004.0,"e":29064.0,"c":8,"t":"Callous your mind and chase pain","k":"The only way past 40 percent is to callous your mind daily, like a boxer who learns to absorb twelve rounds.","cat":"pain","r":3,"q":"callous your mind, chase pain, boxer, twenty years, tolerance","bm":"CHASE PAIN LIKE ITS YOUR DAMN JOB","g":"1VJka  bar, las vegas, mom, triple vision, emergency room, medical crisis","bm":null,"g":"12qCx4eSyx9pjaUG9Osy3weyOwk1lkXxc"},{"id":"c332","s":46539.0,"e":46617.0,"c":12,"t":"Replaying his life's highlight reel","k":"Bedridden and wondering if this was the end, he replayed everything he had overcome.","cat":"story","r":2,"q":"highlight reel, deathbed, show no weakness, overcame, obese, heart surgeries, sky diving","bm":"HIGHLIGHT REEL","g":"13vyAPDbhgaNsoWeU3kamfZZW9pyxrZWN"},{"id":"c333","s":46617.0,"e":46666.0,"c":12,"t":"Never hitting snooze on his life clock","k":"He never stopped to appreciate his story; even on a 20-hour day he worked out for an hour and slept three.","cat":"feat","r":2,"q":"never stopped, 20 hour day, one hour workout, three hours sleep, sum total of obstacles, snooze","bm":"Never stopped long - 20/1/3","g":"1lR4PYEQapj2v6MGtvVuiBNFAeVxY-OvC"},{"id":"c334","s":46634.0,"e":46681.0,"c":12,"t":"A brain not wired to appreciate","k":"His mind was programmed to work and ask what's next, which is why he stacked up rare feats.","cat":"pain","r":2,"q":"brain not wired to appreciate, whats next, obsession, never satisfied, feats","bm":"BRAIN WASNT WIRED TO APPRECIATE","g":"1Eg09hxhAYVjHkXNu6IETBspi72qzDWSg"},{"id":"c335","s":46681.0,"e":46744.0,"c":12,"t":"Facing death with gratitude","k":"Believing he was dying at 38, he felt no self-pity, only gratitude, seeing his destroyed body as his biggest trophy.","cat":"story","r":2,"q":"gratitude, dying, deathbed, cookie jar, biggest trophy, acceptance","bm":"GRATITUDE","g":"1vhlM-g5UWxQ_d6Nrv5b45izaQ19iCuZN"},{"id":"c336","s":46744.0,"e":46816.0,"c":12,"t":"Understanding his younger self","k":"Instead of judging the kid who lied and cheated, he finally understood that boy acted out of shame and a need for acceptance.","cat":"story","r":3,"q":"younger self, forgiveness, clarity, cheating, special education, lonely journey","bm":"INSTEAD OF COMING DOWN ON YOUBG ME....","g":"1QYkY35wJABIi01uq6dXHcMVNSx685mDP"},{"id":"c337","s":46816.0,"e":46880.0,"c":12,"t":"Letting go of rage and judgment","k":"He released himself and every hater, racist and abuser from bitterness, appreciating them for creating him, and found peace.","cat":"story","r":2,"q":"rage, judgment, forgiveness, haters, racists, peace, blast radius","bm":null,"g":"1VRbZSvcq9yUSP_QAkCADjnPrCfd8AKv5"},{"id":"c338","s":46880.0,"e":46970.0,"c":12,"t":"Pain unlocks a secret doorway in the mind","k":"Persist past the mind's panic until pain saturates it and you reach single-pointed focus, peak performance and silence.","cat":"pain","r":3,"q":"pain unlocks, secret doorway, zen monks, marathon monks, enlightenment, single pointed, silence","bm":"PAIN UNLOCKS A SECRET DOORWAY IN THE MIND","g":"1G0skTudGhzTAR1CeMnU-VcP73LTTKiKN"},{"id":"c339","s":47141.0,"e":47228.0,"c":12,"t":"Peaceful but never satisfied","k":"Accepting his fate did not mean lying down to die; peace and acceptance still leave room to fight to fix what is wrong.","cat":"pain","r":3,"q":"peaceful but never satisfied, acceptance, stretching, what if, fight, doctors","bm":"PEACEFUL BUT NEVER SATISFIED","g":"1gIWo-icbj34eoghYBDeQuKNT_aT_4lyD"},{"id":"c340","s":47389.0,"e":47487.0,"c":12,"t":"Stretching up to twelve hours a day","k":"He stretched through the pain six to twelve hours a day until the knots shrank and he got off his medications.","cat":"feat","r":2,"q":"stretching, twelve hours a day, obsession, recovery, routine, psoas, still doing it","bm":null,"g":"17EJGgFDpsi773NvWXoH4VqDaJPFXPDgT"},{"id":"c341","s":47616.0,"e":47663.0,"c":12,"t":"Getting his powers back","k":"Healed by stretching, he topped his EMT and fire academy classes and won ultras again.","cat":"feat","r":2,"q":"emt, fire academy, strolling jim, infinitus, wildland firefighter, comeback","bm":null,"g":"1frYkont-SJick6OvGbmciwu-2wSaTFqu"},{"id":"c342","s":47663.0,"e":47800.0,"c":12,"t":"Kayla's death reunites the brothers","k":"A midnight call about his niece's shooting sent him to Indianapolis, where old grudges with his brother fell away.","cat":"story","r":2,"q":"kayla, trunnis jr, brother, indianapolis, shooting, reconciliation, mom","bm":null,"g":"1O_JG7ZXGmAhyZETVs-lwmdwxFBiY4TmR"},{"id":"c343","s":47725.0,"e":47847.0,"c":12,"t":"Life is suffering and comfort makes us soft","k":"Everyone gets a portion of pain, and seeking comfort and safe spaces to numb it makes us soft.","cat":"truth","r":2,"q":"life is suffering, buddha, comfort, soft, safe spaces, pain, kayla","bm":"LIFE IS SUFFERING - BUDHA","g":"1JqNWZ-nEUOFLBDPJphzi3YyEN21v1klU"},{"id":"c344","s":47847.0,"e":47917.0,"c":12,"t":"Merely motivated people quit at the pain","k":"Breaking out of the box we and our families accept takes hard work, and the merely inspired quit when doubt and pain hit.","cat":"truth","r":2,"q":"comfort zone, limits, motivation, inspired, quit, shackles, doubters","bm":null,"g":"1pVCwoQ2Ji-e7ub6WYh2ofp1xBbyxqGzL"},{"id":"c345","s":47917.0,"e":47960.0,"c":12,"t":"The most important conversations are with yourself","k":"Others doubted his weight loss, but what you tell yourself is what you eventually act on.","cat":"advice","r":3,"q":"self talk, conversations with yourself, doubters, 106 pounds, self doubt","bm":null,"g":"1lD2x9XySBax3RTf7MfU5osVbcTI5vCes"},{"id":"c346","s":47960.0,"e":48003.0,"c":12,"t":"The power of asking what if","k":"What if silences doubt, reminds you that you do not know your limits and lets you use your demons as fuel.","cat":"advice","r":3,"q":"what if, self doubt, demons, fuel, impossible, negativity","bm":null,"g":"1v2H-_i-6wM-p63B6FQd5r92jyY89KCZ-"},{"id":"c347","s":48003.0,"e":48040.0,"c":12,"t":"Your light shows others their own prison","k":"Insecure friends and family fear your success because it exposes their own limits, but the good ones may change too.","cat":"truth","r":2,"q":"jealousy, haters, family, light, prison, people dont want you to succeed","bm":null,"g":"1RJ2F2wfaJiYkwTZ7FspMb67BR5Lr14qu"},{"id":"c348","s":48040.0,"e":48068.0,"c":12,"t":"Callous your mind until pain cannot hurt you","k":"Accept and endure the pain and callous your mind until even pain cannot hurt you, knowing there is no end to it.","cat":"advice","r":2,"q":"callous your mind, cant hurt me, pain, change, limits, no end","bm":null,"g":"1-cSJ9shLy9UxJIjItYApsssZ4Y_7WU60"},{"id":"c349","s":48093.0,"e":48251.0,"c":12,"t":"Wildland firefighting at 43","k":"Leaving hotel comfort, he dug fire lines for a week of 18-hour shifts on the 416 fire alongside a crew of hard workers.","cat":"feat","r":2,"q":"wildland firefighter, 416 fire, durango, colorado, pulaski, 18 hour shifts","bm":null,"g":"1gmozsXAFripcsHqeRZPXHuR24sBfgras"},{"id":"c350","s":48251.0,"e":48348.0,"c":12,"t":"His rage now has to be summoned","k":"His rage now takes conscious effort to reach, but the scars still drive him and he answers doubters with what if.","cat":"pain","r":2,"q":"rage, passion, scar tissue, running faster, what if, shadow","bm":"RAGE TAKES LONGER TO ACTIVATE","g":"18P5boTtUn2PR7XXUaiq9uM2RlorQwZMn"},{"id":"c351","s":48348.0,"e":48407.0,"c":12,"t":"Accepting your whole life brings peace","k":"Confessing his whole life taught him that accepting the good, bad and ugly leads to peace, and none of it was for praise.","cat":"pain","r":2,"q":"acceptance, peace, confession, me against me, praise, catholic","bm":"ACCEPTANCE OF ALL YOUR GOOD AND BAD OTHER SIDE OF THAT IS PEACE","g":"1-kw694JwMfw2ra-vinfcKH7keH_ZjFYA"},{"id":"c352","s":48410.0,"e":48493.0,"c":12,"t":"No peace without going to war with yourself","k":"People want to jump to peace, but you only find it, and more of yourself, by first going to war with yourself.","cat":"pain","r":3,"q":"war with yourself, peace, self acceptance, monks, find more of yourself, television","bm":"GO TO WAR WITH YOUSELF... then peace comes","g":"1Q0P69yGyu_IYrUrCfV818WeTWGBYiTWV"},{"id":"c353","s":48493.0,"e":48535.0,"c":12,"t":"Peace is a feeling, not a look","k":"His stoic face fools people; peace comes fro     (c.bm ? '<p class="note"><b>Your note:</b> ' + esc(c.bm) + '</p>' : '') +
    '<div class="acts"><span style="color:var(--muted)">' + esc(catName[c.cat] || '') + '</span>' +
    '<button data-a="heard">' + (S.heard.has(c.id) ? 'Mark unheard' : 'Mark heard') + '</button></div></div></li>';
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  document.querySelectorAll('#cats .chip').forEach(b => b.classList.toggle('on', b.dataset.c === S.cat));
  document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('on', b.dataset.s === S.sort));
  const v = visible(); let h = '';
  if (!v.length) h = '<p class="empty">No clips match.</p>';
  else if (S.sort === 'book') {
    let ch = -1;
    v.forEach(c => { if (c.c !== ch){ if (ch !== -1) h += '</ul>'; ch = c.c; h += '<div class="ch">' + esc(CH[ch]) + '</div><ul class="list">'; } h += clipHTML(c); });
    h += '</ul>';
  } else h = '<ul class="list">' + v.map(clipHTML).join('') + '</ul>';
  $('list').innerHTML = h;
  $('playall').querySelector('span').textContent = 'Play all ' + v.length;
}
$('list').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const c = byId[b.closest('.clip').dataset.id], a = b.dataset.a;
  if (a === 'play'){ if (P.cur === c){ au.paused ? au.play() : au.pause(); } else start(visible(), c); }
  else if (a === 'open'){ S.open = S.open === c.id ? null : c.id; render(); }
  else if (a === 'fav'){ S.favs.has(c.id) ? S.favs.delete(c.id) : S.favs.add(c.id); ls.set('favs', [...S.favs]); render(); }
  else if (a === 'heard'){ S.heard.has(c.id) ? S.heard.delete(c.id) : S.heard.add(c.id); ls.set('heard', [...S.heard]); render(); }
};

/* player: on the Mac it plays the full audiobook file beside this page; anywhere else (or if that file
   is missing) it plays each clip's own file from Google Drive. */
const au = $('au');
const P = {queue: [], i: -1, cur: null, mode: location.protocol === 'file:' ? 'full' : 'clip', off: 0, loaded: false};
const fullSrc = () => AUDIO_FILE.split('/').map(encodeURIComponent).join('/');
const clipSrc = c => 'https://www.googleapis.com/drive/v3/files/' + c.g + '?alt=media&key=' + DKEY;
if (!DKEY) P.mode = 'full';
const bt = () => au.currentTime + P.off;          // position in book time
function seekPlay(t){
  const go = () => { au.currentTime = Math.max(0, t); au.playbackRate = S.speed; au.play().catch(() => {}); };
  if (au.readyState >= 1) go(); else au.addEventListener('loadedmetadata', go, {once: true});
}
au.addEventListener('error', () => {
  if (P.mode === 'full' && DKEY && P.cur && P.cur.g){ P.mode = 'clip'; P.loaded = false; play(P.cur); return; }
  $('err').innerHTML = '<p class="err">The audio did not load. On your Mac, keep this page in the same folder as "' + esc(AUDIO_FILE) + '".</p>';
});
function start(queue, c){ P.queue = queue; P.i = queue.indexOf(c); play(c); }
function play(c){
  P.cur = c; S.keep = false; $('err').innerHTML = '';
  if (P.mode === 'full'){
    if (!P.loaded){ au.src = fullSrc(); au.load(); P.loaded = true; }
    P.off = 0; seekPlay(c.s);
  } else {
    P.off = c.s; au.src = clipSrc(c); au.load(); seekPlay(0);
  }
  $('player').hidden = false; showPlayer(); render(); media(c);
}
function step(d){
  const j = P.i + d;
  if (j >= 0 && j < P.queue.length){ P.i = j; play(P.queue[j]); }
  else if (d > 0){ au.pause(); P.i = -1; showPlayer(); render(); }
}
function finish(){
  if (!P.cur) return;
  if (!S.heard.has(P.cur.id)){ S.heard.add(P.cur.id); ls.set('heard', [...S.heard]); }
  if (P.queue.length > 1 && P.i + 1 < P.queue.length) step(1); else { au.pause(); render(); }
}
au.addEventListener('timeupdate', () => {
  const c = P.cur; if (!c) return;
  const t = bt();
  if (P.mode === 'full' && !S.keep && t >= c.e) { finish(); return; }
  const span = S.keep ? Math.max(c.e, t) - c.s : c.e - c.s;
  $('pfill').style.width = Math.min(100, (t - c.s) / span * 100) + '%';
  $('pcur').textContent = fmt(t - c.s);
});
au.addEventListener('ended', () => finish());
au.addEventListener('play', () => { $('ppi').innerHTML = PAUSE.replace(/<\/?svg[^>]*>/g, ''); render(); });
au.addEventListener('pause', () => { $('ppi').innerHTML = PLAY.replace(/<\/?svg[^>]*>/g, ''); render(); });
function showPlayer(){
  const c = P.cur; if (!c) return;
  $('ptitle').textContent = c.t; $('plen').textContent = fmt(c.e - c.s);
  $('pq').textContent = P.queue.length > 1 && P.i >= 0 ? (P.i + 1) + ' of ' + P.queue.length : CH[c.c];
  $('keep').hidden = P.mode !== 'full';
  $('keep').classList.toggle('on', S.keep); $('speed').textContent = S.speed + 'x';
}
$('pp').onclick = () => { if (!P.cur) return; au.paused ? au.play() : au.pause(); };
$('back').onclick = () => { au.currentTime = Math.max(P.mode === 'full' && P.cur ? P.cur.s - 30 : 0, au.currentTime - 15); };
$('fwd').onclick = () => { au.currentTime = au.currentTime + 15; };
$('prev').onclick = () => { if (P.cur && bt() - P.cur.s > 4) au.currentTime = P.cur.s - P.off; else step(-1); };
$('next').onclick = () => step(1);
$('keep').onclick = () => { S.keep = !S.keep; showPlayer(); };
const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
$('speed').onclick = () => { S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; au.playbackRate = S.speed; ls.set('speed', S.speed); showPlayer(); };
$('prog').onclick = e => { const c = P.cur; if (!c) return; const r = e.currentTarget.getBoundingClientRect();
  au.currentTime = c.s - P.off + (e.clientX - r.left) / r.width * (c.e - c.s); };
$('playall').onclick = () => { const v = visible(); if (v.length) start(v, v[0]); };
function media(c){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({title: c.t, artist: 'David Goggins', album: "Can't Hurt Me"});
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
}
render();
</script>
</body>
